name: Release

# Builds the playable game for Windows and Linux with Godot's exporter.
# - Push to the release-check branch: builds and prepares a *draft* release named after the
#   VERSION file (e.g. v1.0.0). Publishing that draft on GitHub creates the tag.
# - Push a tag like v1.0.0 (or publish a draft): builds and attaches the zips to that release.
# - Run it by hand (Actions > Release > Run workflow) to just get the zips as build artifacts.

on:
  push:
    tags: ['v*']
    # Pushing to this branch runs the export without publishing (a dry run).
    branches: [release-check]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.3
  GODOT_RELEASE: stable

jobs:
  export:
    name: Export Windows + Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Cache Godot and export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}-mono-win-linux

      - name: Download Godot (.NET) and export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}"
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_mono_linux_x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          curl -fsSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_mono_export_templates.tpz"
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}.mono
          mkdir -p "$dest"
          # Only the templates we export with (the full archive is ~1 GB).
          unzip -q -j /tmp/templates.tpz \
            templates/version.txt \
            templates/linux_release.x86_64 templates/linux_debug.x86_64 \
            templates/windows_release_x86_64.exe templates/windows_debug_x86_64.exe \
            templates/windows_release_x86_64_console.exe templates/windows_debug_x86_64_console.exe \
            -d "$dest"
          rm /tmp/godot.zip /tmp/templates.tpz

      - name: Locate Godot
        run: |
          echo "GODOT=$(find ~/godot -type f -name 'Godot_v*_mono_linux.x86_64' | head -n1)" >> "$GITHUB_ENV"

      - name: Import project
        run: |
          # The first run imports resources and builds the C# project; it may exit non-zero
          # on a fresh checkout, so don't fail on it — the export below is the real check.
          "$GODOT" --headless --path game --import || true
          dotnet build game/ContingencyZero.Game.csproj --configuration Debug

      - name: Export Windows
        run: |
          mkdir -p build/windows
          "$GODOT" --headless --path game --export-release "Windows" ../build/windows/ContingencyZero.exe
          test -f build/windows/ContingencyZero.exe

      - name: Export Linux
        run: |
          mkdir -p build/linux
          "$GODOT" --headless --path game --export-release "Linux" ../build/linux/ContingencyZero.x86_64
          test -f build/linux/ContingencyZero.x86_64

      - name: Package
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then version="$GITHUB_REF_NAME"; else version="v$(tr -d '[:space:]' < VERSION)"; fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          cp docs/HOW_TO_PLAY.txt build/windows/
          cp docs/HOW_TO_PLAY.txt build/linux/
          chmod +x build/linux/ContingencyZero.x86_64
          mkdir -p dist
          (cd build/windows && zip -qr "../../dist/ContingencyZero-${version}-windows.zip" .)
          (cd build/linux && tar -czf "../../dist/ContingencyZero-${version}-linux.tar.gz" .)
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: ContingencyZero-${{ env.VERSION }}
          path: dist/*

      - name: Publish GitHub Release (tags)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Publishing a prepared draft creates the tag; then just refresh its files.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "Contingency Zero $GITHUB_REF_NAME" \
              --notes-file docs/RELEASE_NOTES.md
          fi

      - name: Prepare draft release (release-check branch)
        if: github.ref == 'refs/heads/release-check'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Replace any earlier draft for this version (drafts have no tag yet), and the old dry-run draft.
          gh release delete release-check-draft --yes || true
          for id in $(gh api "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.draft and .tag_name == \"$VERSION\") | .id"); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done
          gh release create "$VERSION" dist/* --draft --target "$GITHUB_SHA" \
            --title "Contingency Zero $VERSION" \
            --notes-file docs/RELEASE_NOTES.md
