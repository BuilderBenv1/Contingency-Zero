name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sim-tests:
    # The same golden hash must come out on every OS, or the sim isn't deterministic.
    name: Sim tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test ContingencyZero.sln --configuration Release --logger "console;verbosity=normal"

  game-build:
    name: Godot C# project compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build game/ContingencyZero.Game.csproj --configuration Debug
